name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Lint / Typecheck
        run: bun run lint

      - name: Run Test Suite
        run: bun run test
        env:
          ALLOW_CURATED_RESEARCH_FALLBACK: 'true'

      - name: Build Application
        run: bun run build
        env:
          VITE_APP_BASE_PATH: /masterai-public/

      - name: Verify GitHub Pages static build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text()
          paths = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          assets = [p for p in paths if p.endswith(('.js', '.css'))]
          assert assets, 'No compiled JS/CSS references found in index.html'
          for asset in assets:
              assert asset.startswith('/masterai-public/'), f'Unexpected asset URL: {asset}'
              local = Path('dist') / asset.removeprefix('/masterai-public/')
              assert local.is_file(), f'Missing compiled asset: {local}'
          print(f'Pages static asset check passed ({len(assets)} assets)')
          PY
